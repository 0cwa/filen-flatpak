name: Release Flatpak

on:
  push:
    tags:
      - "v*"
      - "filen-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example filen-v1.2.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and verify ${{ matrix.variant.arch }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set reproducible build timestamp
        shell: bash
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          commit="$(git rev-parse --verify HEAD^{commit})"
          source_date_epoch="$(git show -s --format=%ct "$commit")"

          if [[ ! "$source_date_epoch" =~ ^[0-9]+$ ]]; then
            echo "Could not determine a numeric SOURCE_DATE_EPOCH for $commit." >&2
            exit 1
          fi

          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
          echo "Using SOURCE_DATE_EPOCH=$source_date_epoch from commit $commit."

      - name: Build release bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: filen-${{ matrix.variant.arch }}.flatpak
          manifest-path: io.filen.Filen.yml
          arch: ${{ matrix.variant.arch }}
          build-dir: builddir-${{ matrix.variant.arch }}-release
          repo-dir: repo-${{ matrix.variant.arch }}-release
          state-dir: .flatpak-builder-${{ matrix.variant.arch }}-release
          cache: false
          restore-cache: false
          upload-artifact: false
          verbose: true

      - name: Build reproducibility check bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: filen-${{ matrix.variant.arch }}.repro.flatpak
          manifest-path: io.filen.Filen.yml
          arch: ${{ matrix.variant.arch }}
          build-dir: builddir-${{ matrix.variant.arch }}-repro
          repo-dir: repo-${{ matrix.variant.arch }}-repro
          state-dir: .flatpak-builder-${{ matrix.variant.arch }}-repro
          cache: false
          restore-cache: false
          upload-artifact: false
          verbose: true

      - name: Verify reproducible build contents
        shell: bash
        run: |
          set -euo pipefail

          release_bundle="filen-${{ matrix.variant.arch }}.flatpak"
          repro_bundle="filen-${{ matrix.variant.arch }}.repro.flatpak"
          release_repo="repo-${{ matrix.variant.arch }}-release"
          repro_repo="repo-${{ matrix.variant.arch }}-repro"
          log="filen-${{ matrix.variant.arch }}.reproducibility.txt"

          {
            echo "Bundle checksums:"
            sha256sum "$release_bundle" "$repro_bundle"
            echo
          } | tee "$log"

          release_hash="$(sha256sum "$release_bundle" | cut -d ' ' -f 1)"
          repro_hash="$(sha256sum "$repro_bundle" | cut -d ' ' -f 1)"

          if [ "$release_hash" != "$repro_hash" ]; then
            {
              echo "Bundle files are not byte-identical."
              echo "Continuing with Flatpak ref content verification because build-bundle output can contain nondeterministic transport metadata."
              echo
            } | tee -a "$log"
          fi

          mapfile -t release_refs < <(ostree --repo="$release_repo" refs | grep '^app/io\.filen\.Filen/')
          mapfile -t repro_refs < <(ostree --repo="$repro_repo" refs | grep '^app/io\.filen\.Filen/')

          if [ "${#release_refs[@]}" -ne 1 ] || [ "${#repro_refs[@]}" -ne 1 ]; then
            {
              echo "Expected exactly one app ref in each repo."
              echo "Release refs: ${release_refs[*]:-(none)}"
              echo "Repro refs: ${repro_refs[*]:-(none)}"
            } | tee -a "$log" >&2
            exit 1
          fi

          release_ref="${release_refs[0]}"
          repro_ref="${repro_refs[0]}"

          if [ "$release_ref" != "$repro_ref" ]; then
            {
              echo "Flatpak refs differ."
              echo "Release ref: $release_ref"
              echo "Repro ref: $repro_ref"
            } | tee -a "$log" >&2
            exit 1
          fi

          release_commit="$(ostree --repo="$release_repo" rev-parse "$release_ref")"
          repro_commit="$(ostree --repo="$repro_repo" rev-parse "$repro_ref")"

          {
            echo "Flatpak ref: $release_ref"
            echo "Release OSTree commit: $release_commit"
            echo "Repro OSTree commit: $repro_commit"
            echo
          } | tee -a "$log"

          rm -rf reproducibility-check
          mkdir -p reproducibility-check/release-tree reproducibility-check/repro-tree

          ostree --repo="$release_repo" checkout "$release_commit" reproducibility-check/release-tree
          ostree --repo="$repro_repo" checkout "$repro_commit" reproducibility-check/repro-tree

          make_manifest() {
            local tree="$1"
            local output="$2"

            {
              cd "$tree"
              find . -xdev -printf '%y %m %U %G %s %p -> %l\n' | LC_ALL=C sort
              find . -xdev -type f -print0 | LC_ALL=C sort -z | xargs -0 --no-run-if-empty sha256sum
            } > "$output"
          }

          make_manifest reproducibility-check/release-tree reproducibility-check/release.manifest
          make_manifest reproducibility-check/repro-tree reproducibility-check/repro.manifest

          if ! diff -u reproducibility-check/release.manifest reproducibility-check/repro.manifest >> "$log"; then
            echo "Release build contents are not reproducible for ${{ matrix.variant.arch }}." | tee -a "$log" >&2
            exit 1
          fi

          echo "Release build contents are reproducible for ${{ matrix.variant.arch }}." | tee -a "$log"
          sha256sum "$release_bundle" > "$release_bundle.sha256"

      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: filen-flatpak-${{ matrix.variant.arch }}
          path: |
            filen-${{ matrix.variant.arch }}.flatpak
            filen-${{ matrix.variant.arch }}.flatpak.sha256
            filen-${{ matrix.variant.arch }}.reproducibility.txt
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified bundles
        uses: actions/download-artifact@v8
        with:
          pattern: filen-flatpak-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        working-directory: dist
        run: |
          set -euo pipefail

          sha256sum -c *.sha256
          sha256sum *.flatpak > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* --verify-tag --title "$TAG_NAME" --generate-notes
          fi
