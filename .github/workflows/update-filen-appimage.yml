name: Update Filen AppImage

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Check latest upstream AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify downstream workflow token
        env:
          DOWNSTREAM_WORKFLOW_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "${DOWNSTREAM_WORKFLOW_TOKEN:-}" ]; then
            echo "Set the GH_TOKEN secret so updater pushes trigger CI, release, and Pages workflows." >&2
            exit 1
          fi

      - name: Update manifest pins
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-filen-appimage.js

      - name: Commit update and tag release
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail

          tag="filen-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- io.filen.Filen.yml; then
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Manifest already points at Filen ${VERSION}, and release tag ${tag} already exists."
              exit 0
            fi

            echo "Manifest already points at Filen ${VERSION}; creating missing release tag ${tag}."
            git tag -a "$tag" -m "Filen ${VERSION}"
            git push origin "$tag"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists." >&2
            exit 1
          fi

          git add io.filen.Filen.yml
          git commit -m "chore: update Filen AppImage to ${VERSION}"
          git tag -a "$tag" -m "Filen ${VERSION}"
          git push origin HEAD:main
          git push origin "$tag"
