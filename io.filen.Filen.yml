app-id: io.filen.Filen

runtime: org.freedesktop.Platform
runtime-version: &runtime-version '24.08'
sdk: org.freedesktop.Sdk

base: org.electronjs.Electron2.BaseApp
base-version: *runtime-version

command: startfilen
separate-locales: false

finish-args:
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher # Tray functionalities on KDE
  - --talk-name=com.canonical.AppMenu.Registrar
  - --filesystem=home
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons # This is used to show the correct cursor on Wayland

modules:
  - name: Filen
    buildsystem: simple
    build-commands:
      - chmod +x Filen.AppImage
      - ./Filen.AppImage --appimage-extract
      - desktop-file-edit --set-key="Exec" --set-value="startfilen %U" --set-icon=$FLATPAK_ID
        squashfs-root/Filen.desktop
      - |
        for icon in 16 24 32 48 64 128 256 512; do
          install -D squashfs-root/usr/share/icons/hicolor/${icon}x${icon}/apps/Filen.png \
              /app/share/icons/hicolor/${icon}x${icon}/apps/io.filen.Filen.png
        done
      - install -D squashfs-root/Filen.desktop /app/share/applications/io.filen.Filen.desktop
      - install -Dm755 startfilen /app/bin/startfilen
      - install -D io.filen.Filen.metainfo.xml -t /app/share/metainfo/
      - mv squashfs-root /app/bin/filen

    sources:
      - type: file
        path: startfilen

      - type: file
        path: io.filen.Filen.metainfo.xml

      - type: file
        url: https://github.com/FilenCloudDienste/filen-desktop/releases/download/v3.0.53/Filen_linux_x86_64.AppImage
        dest-filename: Filen.AppImage
        sha256: 888298db82fa43d7be3feeeba86a2f745dbc1ffdf1efabe2cca5144a996461f2
        only-arches: [x86_64]
        x-checker-data:
          type: electron-updater
          url: https://github.com/FilenCloudDienste/filen-desktop/releases/latest/download/latest-linux.yml

      - type: file
        url: https://github.com/FilenCloudDienste/filen-desktop/releases/download/v3.0.53/Filen_linux_arm64.AppImage
        dest-filename: Filen.AppImage
        sha256: 5821bd280e89da9cd5362df91d495bb99cd7630b85f51019033c72eb0664e89d
        only-arches: [aarch64]
        x-checker-data:
          type: electron-updater
          url: https://github.com/FilenCloudDienste/filen-desktop/releases/latest/download/latest-linux-arm64.yml
